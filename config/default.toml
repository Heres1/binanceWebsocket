[risk]
# 最大持仓金额 (USDT) - 3品种并发$64+$35+$20=$119
max_position_usdt = 300.0
# 单笔最大金额 (USDT) - 覆盖BTC 0.002×$70k=$140
max_single_order_usdt = 150.0
# 日亏损上限 (USDT) - $200账户保守风控
max_daily_loss_usdt = 20.0
# 最小下单间隔 (秒)
min_order_interval_secs = 10

[network]
# 网络连接模式: auto, direct, proxy, ssh_tunnel
connection_mode = "ssh_tunnel"
# 代理 URL (仅在 proxy 模式下需要)
# proxy_url = "http://127.0.0.1:7890"
