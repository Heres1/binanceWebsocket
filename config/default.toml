# Binance 量化交易系统配置文件

# ⚠️ 注意：请勿将包含真实 API 密钥的配置文件提交到 Git
# 应该复制此文件为 config.toml 并填入你的真实密钥

[logging]
# 日志级别: trace, debug, info, warn, error
level = "info"
# 日志格式: text, json
format = "text"
# 日志文件路径 (自动创建目录)
file_path = "logs/trading.log"
# 日志轮转大小 (MB)
rotate_size_mb = 50
# 最大备份文件数
max_files = 10

[binance]
# 实盘 API 密钥 (从 https://www.binance.com/cn/my/settings/api-management 获取)
api_key = "qs3H1Ph6hbsFXKBWmv3G2gJaXw2X88V3HGjFQ9AJMIUK2UwwtOCpoRZvjlOojTim"
secret_key = "fbkSDz4UoLkaS8SlkY5qLW2Knn9g9R0naNK3ToUDcKQ0nbr3SSZyIFCwK8y2ztER"
# true=使用测试网, false=使用实盘
testnet = false

[strategy]
# 交易对
symbol = "BTCUSDT"
# 每笔交易数量 (BTC) - 约 $10/笔
quantity_per_trade = 0.00013
# 硬止盈上限 (必须 > trailing_trigger 否则追踪止损是死代码)
take_profit_pct = 2.0
# 初始止损百分比 (放宽止损给趋势呼吸空间，减少噪音扫损)
stop_loss_pct = 1.5
# 最大持仓时间(秒) - 8小时（缩短持仓减少超时亏损）
max_hold_seconds = 28800
# 交易冷却时间(秒) - 10分钟
cooldown_seconds = 600
# 日最大交易次数
max_daily_trades = 50
# 日最大亏损百分比
max_daily_loss_pct = 3.0
# RSI超卖线 (42=要求真正超卖才触发反弹信号，避免下跌中的小回调误触发)
rsi_oversold = 42.0
# RSI超买线 (禁用RSI退出)
rsi_overbought = 100.0
# 买卖量比阈值 (1.0=要求买方成交量真正主导，过滤弱反弹)
volume_ratio_threshold = 1.0
# 保本止损触发 (浮盈达此值后SL上移到入场价，必须 < trailing_trigger)
breakeven_trigger_pct = 0.8
# 追踪止损触发 (浮盈达此值后启用追踪，必须 < take_profit)
trailing_trigger_pct = 1.0
# 追踪止损回撒距离 (从最高/最低点回撒此百分比平仓，0.35%保留更多浮盈)
trailing_distance_pct = 0.35
# 往返手续费% (BUY免费+SELL 0.1% = 0.1%往返，用于保本止损和净盈亏计算)
round_trip_fee_pct = 0.1
# 是否允许做空
allow_short = true
# 策略类型
strategy_type = "Breakout"
# 僵尸仓位早退(秒)：设置超过max_hold=禁用
stale_exit_seconds = 86400
# 僵尸判定门槛(%)
stale_pnl_threshold_pct = 0.05
# EMA趋势强度最低门槛(%)：要求EMA7/EMA21有有意义的分离，避免震荡市假信号
min_trend_strength_pct = 0.03

# 注意: 做空使用与做多相同的TP/SL/追踪参数（对称策略）

# 多品种交易对配置
[[trading_pairs]]
symbol = "BTCUSDT"
quantity_per_trade = 0.0007   # ~$50 @ $73000
allow_short = false            # 账户无足够BTC，禁用做空

[[trading_pairs]]
symbol = "ETHUSDT"
quantity_per_trade = 0.02     # ~$50 @ $2500
allow_short = false           # 不持有ETH，只做多

[[trading_pairs]]
symbol = "SOLUSDT"
quantity_per_trade = 0.3      # ~$50 @ $165
allow_short = false           # 不持有SOL，只做多

[risk]
# 最大持仓金额 (USDT) - 3品种并发
max_position_usdt = 500.0
# 单笔最大金额 (USDT)
max_single_order_usdt = 80.0
# 日亏损上限 (USDT)
max_daily_loss_usdt = 50.0
# 最小下单间隔 (秒)
min_order_interval_secs = 10

[network]
# 网络连接模式: auto, direct, proxy, ssh_tunnel
connection_mode = "ssh_tunnel"
# 代理 URL (仅在 proxy 模式下需要)
# proxy_url = "http://127.0.0.1:7890"
