[risk]
# 最大持仓金额 (USDT) - 当前现货总估值约195U，允许既有BTC余额+新开仓
max_position_usdt = 215.0
# 单笔最大金额 (USDT) - 单笔约159U，保留价格波动缓冲
max_single_order_usdt = 175.0
# 日亏损上限 (USDT) - 全仓后最多承受约2次常规止损
max_daily_loss_usdt = 4.0
# 动态仓位资金使用率：按可用USDT的98.5%与最小缓冲共同约束，避免价格上涨后资金不足
position_allocation_pct = 0.985
# 最小USDT缓冲：即使接近全仓，也至少保留该金额用于滑点/价格波动
min_usdt_reserve = 2.0
# 最小下单间隔 (秒)
min_order_interval_secs = 10

[network]
# 网络连接模式: auto, direct, proxy, ssh_tunnel
connection_mode = "direct"
# 代理 URL (仅在 proxy 模式下需要)
# proxy_url = "http://127.0.0.1:7890"

# === 日级动量轮动策略（strategy_type = "MomentumRotation" 时生效） ===
# 3年跨周期回测验证（2023-03~2026-03）：年化+49.4%，仅17次调仓，熊市自动空仓
# 逻辑：90日动量最高 + 价格>50日均线 → 全仓持有；否则空仓持USDT
[rotation]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
momentum_lookback_days = 90
ma_filter_days = 50
rebalance_interval_days = 30
check_interval_seconds = 14400
min_usdt_value = 10.0
# 干跑模式：true=只打印信号不下单（首次上线验证用），确认无误后改false
dry_run = true
