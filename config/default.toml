# Binance 量化交易系统配置文件

# ⚠️ 注意：请勿将包含真实 API 密钥的配置文件提交到 Git
# 应该复制此文件为 config.toml 并填入你的真实密钥

[logging]
# 日志级别: trace, debug, info, warn, error
level = "info"
# 日志格式: text, json
format = "text"
# 日志文件路径 (自动创建目录)
file_path = "logs/trading.log"
# 日志轮转大小 (MB)
rotate_size_mb = 50
# 最大备份文件数
max_files = 10

[binance]
# 实盘 API 密钥 (从 https://www.binance.com/cn/my/settings/api-management 获取)
api_key = "qs3H1Ph6hbsFXKBWmv3G2gJaXw2X88V3HGjFQ9AJMIUK2UwwtOCpoRZvjlOojTim"
secret_key = "fbkSDz4UoLkaS8SlkY5qLW2Knn9g9R0naNK3ToUDcKQ0nbr3SSZyIFCwK8y2ztER"
# true=使用测试网, false=使用实盘
testnet = false

[strategy]
# 交易对
symbol = "BTCUSDT"
# 每笔交易数量 (BTC) - 动态仓位启用后作为回测基准和单笔数量上限，实盘BUY会按可用USDT自动下调
quantity_per_trade = 0.00256
# 硬止盈上限
# 追踪止损为主，硬止盈只作为极端趋势保护
take_profit_pct = 3.0
# 初始止损百分比
stop_loss_pct = 1.5
# 最大持仓时间(秒) - 6小时，避免弱势单长期占用并拖成大亏
max_hold_seconds = 21600
# 交易冷却时间(秒)
cooldown_seconds = 120
# 日最大交易次数
max_daily_trades = 50
# 日最大亏损百分比（收紧风控，$200账户每天最多亏$4）
max_daily_loss_pct = 2.0
# RSI超卖线 (40=平衡交易频率和质量，回测验证最优)
rsi_oversold = 40.0
# RSI超买线 (禁用RSI退出)
rsi_overbought = 100.0
# 买卖量比阈值 (1.8=要求更明确买盘优势才入场)
volume_ratio_threshold = 1.8
# 保本止损触发：更早覆盖手续费，提升净收益稳定性
breakeven_trigger_pct = 0.5
# 追踪止损触发：更早锁定浮盈
trailing_trigger_pct = 0.8
# 追踪止损回撒距离
trailing_distance_pct = 0.5
# 往返手续费% (BNB抵扣口径 0.075%/侧 = 0.15%往返，用于保本止损和净盈亏计算；需账户开启BNB抵扣)
round_trip_fee_pct = 0.15
# 是否允许做空 (现货模式下必须为false！现货API不支持裸卖空，仅在连接合约API fapi.binance.com时可启用)
allow_short = false
# 策略类型
strategy_type = "MomentumRotation"
# 僵尸仓位早退(秒)：禁用（回测验证关闭更优）
stale_exit_seconds = 999999
# 僵尸判定门槛(%)
stale_pnl_threshold_pct = 0.3
# EMA趋势强度最低门槛(%)：提高趋势质量，过滤弱趋势小盈利/假信号
min_trend_strength_pct = 0.06
# 价格距离EMA50最大百分比：放宽至1.2%（原0.56%），过滤反弹末端追高的同时不误杀正常趋势单
max_ema50_distance_pct = 1.2
# 止损后延长冷却时间(秒) - 止损后暂停更久，避免弱势环境连续追反弹
post_stoploss_cooldown_seconds = 1800
# 均值回归最低斜率门槛(%) - 只允许上升动能中的回踩，不在下跌中接飞刀
mean_revert_min_slope = 0.03
# 突破路径最低斜率门槛(%) - 要求更强趋势确认，过滤震荡假突破
breakout_min_slope = 0.08

# === ATR动态止损 ===
# 止损距离 = N * ATR，收紧单笔亏损，避免一笔大亏吃掉多笔小盈
atr_stop_multiplier = 5.0
# 追踪止损触发 = 浮盈达到 N * ATR 后开启，提前锁定趋势段利润
atr_trailing_multiplier = 2.0
# 追踪止损距离 = N * ATR，减少回吐
atr_trailing_distance = 1.5
# 是否启用ATR止损 (false=回退到固定%止损)
use_atr_stops = true

# === ADX趋势过滤 ===
# ADX最低门槛 (低于此值=震荡市，不入场)
adx_min_threshold = 20.0
# 强趋势阈值 (ADX>此值=入场评分加分)
adx_strong_trend = 30.0
# +DI/-DI方向差最低门槛：避免ADX强但方向偏空时做多弱反弹
min_adx_di_diff = 1.2

# === 波动率政权过滤 ===
# ATR百分位下限：过滤极低波动震荡噪声
atr_percentile_low = 5.0
# ATR百分位上限：过滤极高波动插针行情
atr_percentile_high = 95.0

# === 多因子评分入场 ===
# 入场最低分数(满分100，低于此值不入场)：降至50（原75），路线B松绑过滤、用风控替代过滤
entry_score_threshold = 50
# 突破路径RSI上限：防止反弹末端追高
breakout_max_rsi = 60.0
# 均值回归最小回撤：过滤浅跌假反弹（原1.5%，降至1.0%提高频率）
mean_revert_min_drop_pct = 1.0
# 下跌中继检测窗口：最近N根1m高低点连续下移时禁止做多弱反弹
downtrend_filter_lookback = 4
# 连续下移结构中的反转确认幅度：必须重新突破最近高点才允许做多
min_reversal_break_pct = 0.05

# === 入场过滤开关（路线B：松绑过滤、用风控替代过滤） ===
# 是否要求盘口买一量>1.5倍卖一量（实盘订单簿条件，K线回测无法精确模拟，默认关闭；旧行为=true）
require_bid_support = false
# RSI反弹路径RSI上限（防止追入反弹末端；旧值=55.0）
rsi_bounce_max_rsi = 60.0
# 做多要求价格在EMA50上方的最小百分比（旧值=0.15）
min_price_above_ema50_pct = 0.05
# 均值回归是否要求价格仍在EMA50上方（默认关闭：深跌反弹允许短暂跌破；旧行为=true）
mean_revert_require_above_ema50 = false

# === 收益端结构优化（修复小赢大亏） ===
# 分批止盈第一目标位%：触达后卖出50%仓位锁定盈利，剩余仓位保本+继续奔跑（0=禁用）
partial_take_profit_pct = 0.0
partial_take_profit_ratio = 0.5
# 趋势破坏提前认亏：浮亏>0.3%且5m EMA死叉+跌破EMA50时立即出场，不等硬止损
trend_break_exit = false

# === 资金费率过滤（合约情绪，180天BTC回测 -20.15%→-7.66%） ===
# 费率>阈值(多头拥挤付费)时禁止做多；0.0=只在费率≤0(空头付费/市场恐惧)时做多
# 实盘由 funding_rate_service 每10分钟轮询 fapi 公共接口；数据缺失时放行不冻结交易
use_funding_filter = true
funding_long_block_pct = 0.0
# 做空侧对称：费率<-阈值(空头拥挤)时禁止做空（回测引擎内生效）

# === 执行层（成本端突破：限价单省滑点） ===
# 开仓BUY限价单优先：挂低于信号价 limit_entry_offset_pct% 的买单，等待≤limit_entry_wait_seconds秒，未成交撤单转市价兑底
use_limit_entry = true
limit_entry_offset_pct = 0.05
limit_entry_wait_seconds = 30

# === 趋势判断日志（为合约多空积累经验） ===
# 每根5m K线收盘打印多空对称指标快照（EMA/斜率/ADX/±DI/ATR/环境判定）
log_trend_snapshot = true
# 现货模式下评估并跟踪虚拟做空信号（纯日志不交易，含虚拟开平仓与胜率统计）
log_virtual_short = true

# 注意: 做空使用与做多相同的TP/SL/追踪参数（对称策略）

# 多品种交易对配置
[[trading_pairs]]
symbol = "BTCUSDT"
quantity_per_trade = 0.00256   # 动态仓位启用后作为上限，实盘按可用USDT和BTC价格自动下调
allow_short = false

# ETH/SOL在当前熊市不盈利，暂停交易
