# Binance 量化交易系统配置文件

# ⚠️ 注意：请勿将包含真实 API 密钥的配置文件提交到 Git
# 应该复制此文件为 config.toml 并填入你的真实密钥

[logging]
# 日志级别: trace, debug, info, warn, error
level = "info"
# 日志格式: text, json
format = "text"
# 日志文件路径 (自动创建目录)
file_path = "logs/trading.log"
# 日志轮转大小 (MB)
rotate_size_mb = 50
# 最大备份文件数
max_files = 10

[binance]
# 实盘 API 密钥 (从 https://www.binance.com/cn/my/settings/api-management 获取)
api_key = "qs3H1Ph6hbsFXKBWmv3G2gJaXw2X88V3HGjFQ9AJMIUK2UwwtOCpoRZvjlOojTim"
secret_key = "fbkSDz4UoLkaS8SlkY5qLW2Knn9g9R0naNK3ToUDcKQ0nbr3SSZyIFCwK8y2ztER"
# true=使用测试网, false=使用实盘
testnet = false

[strategy]
# 交易对
symbol = "BTCUSDT"
# 每笔交易数量 (BTC) - 按当前现货可用资金约62U控制，预留手续费和价格波动缓冲
quantity_per_trade = 0.0008
# 硬止盈上限
# 追踪止损为主，硬止盈只作为极端趋势保护
take_profit_pct = 3.0
# 初始止损百分比
stop_loss_pct = 1.5
# 最大持仓时间(秒) - 6小时，避免弱势单长期占用并拖成大亏
max_hold_seconds = 21600
# 交易冷却时间(秒)
cooldown_seconds = 120
# 日最大交易次数
max_daily_trades = 50
# 日最大亏损百分比（收紧风控，$200账户每天最多亏$4）
max_daily_loss_pct = 2.0
# RSI超卖线 (40=平衡交易频率和质量，回测验证最优)
rsi_oversold = 40.0
# RSI超买线 (禁用RSI退出)
rsi_overbought = 100.0
# 买卖量比阈值 (1.8=要求更明确买盘优势才入场)
volume_ratio_threshold = 1.8
# 保本止损触发：更早覆盖手续费，提升净收益稳定性
breakeven_trigger_pct = 0.5
# 追踪止损触发：更早锁定浮盈
trailing_trigger_pct = 0.8
# 追踪止损回撒距离
trailing_distance_pct = 0.5
# 往返手续费% (BUY免费+SELL 0.1% = 0.1%往返，用于保本止损和净盈亏计算)
round_trip_fee_pct = 0.1
# 是否允许做空 (现货模式下必须为false！现货API不支持裸卖空，仅在连接合约API fapi.binance.com时可启用)
allow_short = false
# 策略类型
strategy_type = "Breakout"
# 僵尸仓位早退(秒)：禁用（回测验证关闭更优）
stale_exit_seconds = 999999
# 僵尸判定门槛(%)
stale_pnl_threshold_pct = 0.3
# EMA趋势强度最低门槛(%)：提高趋势质量，过滤弱趋势小盈利/假信号
min_trend_strength_pct = 0.06
# 价格距离EMA50最大百分比：更严格过滤趋势末端追高
max_ema50_distance_pct = 0.6
# 止损后延长冷却时间(秒) - 防止止损后立即重新入场
post_stoploss_cooldown_seconds = 600
# 均值回归最低斜率门槛(%) - 只允许上升动能中的回踩，不在下跌中接飞刀
mean_revert_min_slope = 0.03
# 突破路径最低斜率门槛(%) - 要求更强趋势确认，过滤震荡假突破
breakout_min_slope = 0.08

# === ATR动态止损 ===
# 止损距离 = N * ATR，收紧单笔亏损，避免一笔大亏吃掉多笔小盈
atr_stop_multiplier = 5.0
# 追踪止损触发 = 浮盈达到 N * ATR 后开启，提前锁定趋势段利润
atr_trailing_multiplier = 2.0
# 追踪止损距离 = N * ATR，减少回吐
atr_trailing_distance = 1.5
# 是否启用ATR止损 (false=回退到固定%止损)
use_atr_stops = true

# === ADX趋势过滤 ===
# ADX最低门槛 (低于此值=震荡市，不入场)
adx_min_threshold = 20.0
# 强趋势阈值 (ADX>此值=入场评分加分)
adx_strong_trend = 30.0

# === 波动率政权过滤 ===
# ATR百分位下限 (禁用: 0.0)
atr_percentile_low = 0.0
# ATR百分位上限 (禁用: 100.0)
atr_percentile_high = 100.0

# === 多因子评分入场 ===
# 入场最低分数(满分100，低于此值不入场)：只做更高共振信号
entry_score_threshold = 75

# 注意: 做空使用与做多相同的TP/SL/追踪参数（对称策略）

# 多品种交易对配置
[[trading_pairs]]
symbol = "BTCUSDT"
quantity_per_trade = 0.0008    # 当前现货余额约62U，单笔约48U，避免资金不足反复拒单
allow_short = false

# ETH/SOL在当前熊市不盈利，暂停交易
