# Binance 量化交易系统配置文件

# ⚠️ 注意：请勿将包含真实 API 密钥的配置文件提交到 Git
# 应该复制此文件为 config.toml 并填入你的真实密钥

[logging]
# 日志级别: trace, debug, info, warn, error
level = "info"
# 日志格式: text, json
format = "text"
# 日志文件路径 (自动创建目录)
file_path = "logs/trading.log"
# 日志轮转大小 (MB)
rotate_size_mb = 50
# 最大备份文件数
max_files = 10

[binance]
# 实盘 API 密钥 (从 https://www.binance.com/cn/my/settings/api-management 获取)
api_key = "qs3H1Ph6hbsFXKBWmv3G2gJaXw2X88V3HGjFQ9AJMIUK2UwwtOCpoRZvjlOojTim"
secret_key = "fbkSDz4UoLkaS8SlkY5qLW2Knn9g9R0naNK3ToUDcKQ0nbr3SSZyIFCwK8y2ztER"
# true=使用测试网, false=使用实盘
testnet = false

[strategy]
# 交易对
symbol = "BTCUSDT"
# 每笔交易数量 (BTC) - $200账户适度激进
quantity_per_trade = 0.002
# 硬止盈上限
take_profit_pct = 2.0
# 初始止损百分比
stop_loss_pct = 1.5
# 最大持仓时间(秒) - 8小时
max_hold_seconds = 28800
# 交易冷却时间(秒)
cooldown_seconds = 120
# 日最大交易次数
max_daily_trades = 50
# 日最大亏损百分比（收紧风控，$200账户每天最多亏$4）
max_daily_loss_pct = 2.0
# RSI超卖线 (35=真正超卖才标记，避免正常波动触发假信号)
rsi_oversold = 35.0
# RSI超买线 (禁用RSI退出)
rsi_overbought = 100.0
# 买卖量比阈值 (1.2=要求明确买盘优势才入场)
volume_ratio_threshold = 1.2
# 保本止损触发
breakeven_trigger_pct = 0.8
# 追踪止损触发
trailing_trigger_pct = 1.0
# 追踪止损回撒距离
trailing_distance_pct = 0.8
# 往返手续费% (BUY免费+SELL 0.1% = 0.1%往返，用于保本止损和净盈亏计算)
round_trip_fee_pct = 0.1
# 是否允许做空 (纯做多策略，熊市保本牛市盈利)
allow_short = false
# 策略类型
strategy_type = "Breakout"
# 僵尸仓位早退(秒)：禁用（设为极大值，让仓位完全靠timeout/追踪止损退出）
stale_exit_seconds = 999999
# 僵尸判定门槛(%)
stale_pnl_threshold_pct = 0.2
# EMA趋势强度最低门槛(%)：要求EMA7/EMA21有有意义的分离，避免震荡市假信号
min_trend_strength_pct = 0.03

# 注意: 做空使用与做多相同的TP/SL/追踪参数（对称策略）

# 多品种交易对配置
[[trading_pairs]]
symbol = "BTCUSDT"
quantity_per_trade = 0.002    # ~$128 @ $64000 (64%资金，保守中带激进)
allow_short = false

# ETH/SOL在当前熊市不盈利，暂停交易
# [[trading_pairs]]
# symbol = "ETHUSDT"
# quantity_per_trade = 0.02
# allow_short = false
#
# [[trading_pairs]]
# symbol = "SOLUSDT"
# quantity_per_trade = 0.3
# allow_short = false

[risk]
# 最大持仓金额 (USDT) - 3品种并发$64+$35+$20=$119
max_position_usdt = 300.0
# 单笔最大金额 (USDT) - 覆盖BTC 0.002×$70k=$140
max_single_order_usdt = 150.0
# 日亏损上限 (USDT) - $200账户保守风控
max_daily_loss_usdt = 20.0
# 最小下单间隔 (秒)
min_order_interval_secs = 10

[network]
# 网络连接模式: auto, direct, proxy, ssh_tunnel
connection_mode = "ssh_tunnel"
# 代理 URL (仅在 proxy 模式下需要)
# proxy_url = "http://127.0.0.1:7890"
