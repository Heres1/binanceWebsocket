[package]
name = "rust-binance-event-driven"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "trading"
path = "src/main.rs"

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
futures = "0.3"
url = "2.0"
tokio-rustls = "0.24"
rustls = "0.21"
webpki-roots = "0.25"
log = "0.4"
env_logger = "0.10"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0"
config = "0.13"
parking_lot = "0.12"
dashmap = "5.4"
toml = "0.7"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"